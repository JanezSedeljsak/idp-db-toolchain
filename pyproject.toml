[project]
name = "idp-db-backupper"
version = "0.1.0"
description = "PostgreSQL backup tool with zstd compression and S3 storage (LocalStack/AWS)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "typer>=0.12.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "boto3>=1.35.0",
    "zstandard>=0.23.0",
    "httpx>=0.27.0",
    "croniter>=2.0.0",
]

[project.scripts]
dbbackupper = "scripts.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "mypy>=1.13.0",
    "types-boto3>=1.35.0",
]

[tool.uv]
package = true

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: integration tests requiring live postgres/localstack",
]
