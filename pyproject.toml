[project]
name = "idp-db-backupper"
version = "0.1.0"
description = "PostgreSQL backup tool with zstd compression and S3 storage (LocalStack/AWS)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "typer>=0.12.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.0",
    "boto3>=1.35.0",
    "zstandard>=0.23.0",
    "httpx>=0.27.0",
    "croniter>=2.0.0",
]

[project.scripts]
dbbackupper = "scripts.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "C4",
    "PTH",
    "RUF",
]
ignore = [
    "B008",  # typer.Option / typer.Argument in defaults
]

[tool.ruff.lint.isort]
known-first-party = ["scripts"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
