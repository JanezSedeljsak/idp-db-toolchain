apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: db-toolchain
        orgId: 1
        folder: idp-db-toolchain
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
  idp-db-toolchain.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "panels": [
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "bytes" } },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "id": 1,
          "targets": [
            { "expr": "db_toolchain_database_size_bytes", "legendFormat": "{{database}}" }
          ],
          "title": "Database size",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "id": 2,
          "targets": [
            { "expr": "db_toolchain_connections", "legendFormat": "{{database}} connections" },
            { "expr": "db_toolchain_active_queries", "legendFormat": "{{database}} active" }
          ],
          "title": "Connections",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "id": 3,
          "targets": [
            {
              "expr": "db_toolchain_last_backup_timestamp_seconds",
              "legendFormat": "{{database}}"
            }
          ],
          "title": "Last successful backup",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "id": 4,
          "targets": [
            { "expr": "db_toolchain_backup_failure_streak", "legendFormat": "{{database}}" }
          ],
          "title": "Backup failure streak",
          "type": "timeseries"
        }
      ],
      "schemaVersion": 39,
      "tags": ["postgres", "backups", "idp-db-toolchain"],
      "templating": {
        "list": [
          {
            "name": "datasource",
            "query": "prometheus",
            "type": "datasource"
          }
        ]
      },
      "time": { "from": "now-7d", "to": "now" },
      "title": "idp-db-toolchain",
      "uid": "idp-db-toolchain",
      "version": 1
    }
