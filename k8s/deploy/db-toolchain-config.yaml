apiVersion: v1
kind: ConfigMap
metadata:
  name: db-toolchain-config
data:
  db-toolchain.toml: |
    app_env = "prod"

    [s3]
    bucket = "REPLACE_ME"
    prefix = "backups"
    region = "eu-central-1"

    [schedule]
    backup = "0 2 * * *"
    retention = "0 3 1 * *"

    [backup]
    zstd_level = 3

    [metrics]
    port = 8080
    slow_query_ms = 5000

    [anonymize]
    salt = "REPLACE_ME"

    [scheduler]
    max_failures = 5

    [notify]
    webhook_url = ""

    [data]
    dir = "/var/lib/db-toolchain"
