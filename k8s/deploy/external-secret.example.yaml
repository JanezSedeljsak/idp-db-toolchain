# Example — requires External Secrets Operator and a ClusterSecretStore (e.g. AWS SSM/Secrets Manager).
# Apply after creating secrets in your store. Do not commit real values.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: db-toolchain-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: db-toolchain-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASES
      remoteRef:
        key: idp-db-toolchain/prod
        property: databases_json
    - secretKey: NOTIFY_WEBHOOK_URL
      remoteRef:
        key: idp-db-toolchain/prod
        property: notify_webhook_url
    - secretKey: ANONYMIZE_SALT
      remoteRef:
        key: idp-db-toolchain/prod
        property: anonymize_salt
