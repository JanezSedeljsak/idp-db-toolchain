apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-toolchain
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: db-toolchain
  template:
    metadata:
      labels:
        app: db-toolchain
    spec:
      serviceAccountName: db-toolchain
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: db-toolchain
          image: idp-db-toolchain:local
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
              name: metrics
          command: ["python", "manage.py", "schedule"]
          envFrom:
            - secretRef:
                name: db-toolchain-secrets
                optional: true
          env:
            - name: DB_TOOLCHAIN_CONFIG
              value: /etc/db-toolchain/db-toolchain.toml
          volumeMounts:
            - name: config
              mountPath: /etc/db-toolchain
              readOnly: true
            - name: data
              mountPath: /var/lib/db-toolchain
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: metrics
            periodSeconds: 5
            failureThreshold: 12
      volumes:
        - name: config
          configMap:
            name: db-toolchain-config
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
