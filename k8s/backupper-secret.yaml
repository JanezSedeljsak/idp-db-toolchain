apiVersion: v1
kind: Secret
metadata:
  name: backupper-env
type: Opaque
stringData:
  DATABASES: |
    [
      {"id":"shop","url":"postgres://backupper:backupper@postgres:5432/shop?sslmode=disable"},
      {"id":"billing","url":"postgres://backupper:backupper@postgres:5432/billing?sslmode=disable"},
      {"id":"analytics","url":"postgres://backupper:backupper@postgres:5432/analytics?sslmode=disable"}
    ]
  AWS_ENDPOINT_URL: http://localstack:4566
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_REGION: us-east-1
  S3_BUCKET: db-backups
  S3_PREFIX: backups
  APP_ENV: dev
  ZSTD_LEVEL: "3"
  MAX_SCHEDULE_FAILURES: "5"
  SLOW_QUERY_MS: "5000"
  METRICS_PORT: "8080"
