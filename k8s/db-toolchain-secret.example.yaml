# Example only - do NOT apply. Dev stack generates LocalStack credentials via kustomize secretGenerator.
#
# Production: use IRSA (see k8s/deploy/) and External Secrets for database URLs / webhooks.
apiVersion: v1
kind: Secret
metadata:
  name: db-toolchain-env
type: Opaque
stringData:
  # LocalStack only (dev). Omit AWS_* in prod - use the pod ServiceAccount + IRSA.
  AWS_ACCESS_KEY_ID: "<localstack-only>"
  AWS_SECRET_ACCESS_KEY: "<localstack-only>"
  # Optional overrides (prefer ExternalSecret -> db-toolchain-secrets):
  # DATABASES: '[{"id":"shop","url":"postgres://..."}]'
  # NOTIFY_WEBHOOK_URL: "https://hooks.example.com/..."
