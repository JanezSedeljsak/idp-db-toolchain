apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
data:
  00-init.sh: |
    #!/bin/bash
    set -euo pipefail
    for db in shop billing analytics; do
      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" -d postgres \
        -tc "SELECT 1 FROM pg_database WHERE datname = '${db}'" | grep -q 1 \
        || psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" -d postgres -c "CREATE DATABASE ${db}"
      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" -d "${db}" \
        -f /docker-entrypoint-initdb.d/01-schema.sql
      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" -d "${db}" \
        -f /docker-entrypoint-initdb.d/02-anonymize.sql
    done
  01-schema.sql: |
    CREATE TABLE IF NOT EXISTS users (
        id SERIAL PRIMARY KEY,
        email TEXT NOT NULL UNIQUE,
        name TEXT NOT NULL,
        created_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );
    CREATE TABLE IF NOT EXISTS orders (
        id SERIAL PRIMARY KEY,
        user_id INTEGER NOT NULL REFERENCES users(id),
        amount_cents INTEGER NOT NULL,
        status TEXT NOT NULL DEFAULT 'pending',
        created_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );
    CREATE TABLE IF NOT EXISTS audit_log (
        id SERIAL PRIMARY KEY,
        source TEXT NOT NULL,
        message TEXT NOT NULL,
        created_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );
  02-anonymize.sql: |
    CREATE EXTENSION IF NOT EXISTS pgcrypto;
    CREATE SCHEMA IF NOT EXISTS "db-toolchain";
    CREATE TABLE IF NOT EXISTS "db-toolchain".anonymize_columns (
        table_schema TEXT NOT NULL DEFAULT 'public',
        table_name TEXT NOT NULL,
        column_name TEXT NOT NULL,
        enabled BOOLEAN NOT NULL DEFAULT TRUE,
        PRIMARY KEY (table_schema, table_name, column_name)
    );
    CREATE OR REPLACE FUNCTION "db-toolchain".anonymize_text(plain TEXT, salt TEXT DEFAULT 'db-toolchain')
    RETURNS TEXT LANGUAGE sql IMMUTABLE AS $$
        SELECT encode(digest(coalesce(plain, '') || salt, 'sha256'), 'hex');
    $$;
    CREATE OR REPLACE FUNCTION "db-toolchain".anonymize_integer(val INTEGER, salt TEXT DEFAULT 'db-toolchain')
    RETURNS INTEGER LANGUAGE sql IMMUTABLE AS $$
        SELECT abs(hashtext(val::text || salt));
    $$;
    INSERT INTO "db-toolchain".anonymize_columns (table_name, column_name) VALUES
        ('users', 'name'),
        ('users', 'email'),
        ('orders', 'amount_cents')
    ON CONFLICT DO NOTHING;
