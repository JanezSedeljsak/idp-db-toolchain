line-length = 100
target-version = "py314"

[lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "C4",
    "PTH",
    "RUF",
]
ignore = [
    "B008", # typer.Option / typer.Argument in defaults
]

[lint.isort]
known-first-party = ["backup", "cli", "config", "db", "logging_config", "observability", "ops", "paths", "storage"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
