repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: secret-guard
        name: block env files and hardcoded secrets
        entry: python3 hooks/pre_commit_secret_guard.py
        language: system
        types: [text]
        exclude: ^\.env\.example$
