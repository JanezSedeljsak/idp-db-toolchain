name: Publish

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to deploy (default short git sha)
        required: false
      run_smoke:
        description: Run a one-off backup Job after deploy
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
      - name: Rolling deploy
        env:
          PUBLISH_TARGET: remote
          PUBLISH_TAG: ${{ inputs.image_tag }}
          DEPLOY_NAMESPACE: ${{ vars.DEPLOY_NAMESPACE || 'idp-db-backupper' }}
          RUN_SMOKE: ${{ inputs.run_smoke }}
        run: |
          TAG="${PUBLISH_TAG:-$(git rev-parse --short HEAD)}"
          export IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):${TAG}"
          ./dev.sh ci-publish-deploy
